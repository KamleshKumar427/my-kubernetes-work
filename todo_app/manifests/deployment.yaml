apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app-dep
  template:
    metadata:
      labels:
        app: todo-app-dep
    spec:
      containers:
        - name: todo-app
          image: kkumar42721/todo-app:1.2
